# Bloc Nginx de l'outil Achats filiales.
#
# À copier dans /etc/nginx/sites-available/achats, puis à activer par un lien
# dans sites-enabled. Le serveur héberge aussi le CRM HM Group : son bloc
# (crm-hmgroup.fr) ne doit pas être touché.
#
# Certbot complètera ce fichier : il ajoutera le bloc 443 avec le certificat
# et la redirection depuis le port 80. Ne pas écrire le bloc 443 à la main.
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Toujours « reload » et jamais « restart » : un restart couperait le CRM.

server {
    listen 80;
    listen [::]:80;
    server_name achats.crm-hmgroup.fr;

    # L'enregistrement du catalogue envoie un JSON qui dépasse le mégaoctet
    # accepté par défaut. Sans cette ligne, la sauvegarde échoue — et elle
    # échoue en silence du point de vue de l'utilisateur.
    client_max_body_size 16m;

    access_log /var/log/nginx/achats-acces.log;
    error_log  /var/log/nginx/achats-erreur.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Indispensable : sans lui l'application ne sait pas qu'elle est
        # servie en HTTPS, et le cookie de session ne passe jamais en
        # « Secure ».
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'enregistrement d'un gros catalogue fait beaucoup d'écritures.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
