name: Vérification

# À chaque push, GitHub compile l'interface et lance l'API contre une vraie
# base MySQL. C'est le filet de sécurité du projet : aucune machine locale
# n'est nécessaire pour savoir si le code tient debout.
#
# Le journal complet est publié sur la branche `ci-logs` (fichier
# logs/latest.log), afin de pouvoir diagnostiquer un échec sans avoir à
# ouvrir l'interface GitHub.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    name: Interface et API
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: motdepasse-ci
          MYSQL_DATABASE: hmgcde
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmotdepasse-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: motdepasse-ci
      DB_NAME: hmgcde
      SESSION_SECRET: secret-de-test-sans-valeur
      SEED_ADMIN_EMAIL: admin@hmgroup.fr
      SEED_ADMIN_PASSWORD: motdepasse-de-test-ci
      SMOKE_PASSWORD: motdepasse-de-test-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérification complète
        id: verification
        run: |
          set -o pipefail
          bash scripts/ci-run.sh 2>&1 | tee "$RUNNER_TEMP/ci.log"

      - name: Publier le journal sur la branche ci-logs
        if: always()
        run: |
          repo="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          cd "$RUNNER_TEMP"
          rm -rf journal
          git clone --depth 1 --branch ci-logs "$repo" journal 2>/dev/null || {
            mkdir journal
            cd journal
            git init -q
            git checkout -q --orphan ci-logs
            git remote add origin "$repo"
            cd ..
          }
          cd journal
          mkdir -p logs
          {
            echo "Run ................ ${{ github.run_id }}"
            echo "Branche ............ ${{ github.ref_name }}"
            echo "Commit ............. ${{ github.sha }}"
            echo "Résultat ........... ${{ steps.verification.outcome }}"
            echo "Date ............... $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "──────────────────────────────────────────────────────────"
            cat "$RUNNER_TEMP/ci.log"
          } > logs/latest.log
          cp logs/latest.log "logs/${{ github.run_id }}.log"
          git add -A
          git -c user.name="Vérification" -c user.email="ci@hmgroup.local" \
              commit -q -m "journal ${{ github.run_id }} — ${{ steps.verification.outcome }}"
          git push -q origin HEAD:ci-logs
